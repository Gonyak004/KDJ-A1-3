<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitFinal - AI 헬스 매니저</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 네비게이션 바 -->
<header class="app-header">
  <div class="header-container">
    <div class="logo">FitFinal <span>AI</span></div>
    <nav class="nav-menu">
      <a href="#hero" class="nav-link active">주요기능</a>
      <a href="#routine" class="nav-link">AI 루틴 매니저</a>
      <a href="#tracker" class="nav-link">일일 기록장</a>
    </nav>
    <a href="#routine" class="nav-btn">무료 체험하기</a>
  </div>
</header>

  <!-- Section 1: 홈 / 소개 -->
  <section id="home" class="section">
    <h1>당신만을 위한 Personal AI 트레이너</h1>
    <p>체중 감량부터 근량 증진까지, AI 맞춤형 스케줄링으로 시작하세요.</p>
    <a href="#ai-manager" class="btn">지금 추천받기</a>
  </section>

  <!-- Section 2: AI 기능 -->
  <section id="ai-manager" class="section">
    <h2>AI 맞춤 루틴 생성</h2>
    <form id="ai-form">
      <div class="form-group">
        <label for="goal">운동 목표</label>
        <select id="goal" required>
          <option value="">선택하세요</option>
          <option value="근육량 증진">근육량 증진 (벌크업)</option>
          <option value="체체방 감량">체지방 감량 (다이어트)</option>
          <option value="체력 증진">체력 및 건강 유지</option>
        </select>
      </div>
      <div class="form-group">
        <label for="level">운동 수준</label>
        <select id="level" required>
          <option value="">선택하세요</option>
          <option value="초급자">초급자 (헬린이)</option>
          <option value="중급자">중급자 (1년 이상)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="days">주당 운동 횟수</label>
        <input type="number" id="days" min="1" max="7" placeholder="예: 3" required>
      </div>
      <button type="submit" id="submit-btn">AI 루틴 생성하기</button>
    </form>

    <!-- AI 결과 / 상태 안내 영역 -->
    <div id="status-msg" class="status-msg"></div>
    <div id="ai-result" class="result-box hidden"></div>
  </section>

  <!-- Section 3: 일일 기록장 -->
  <section id="tracker" class="section">
    <h2>오늘의 운동 & 식단 기록</h2>
    <div class="tracker-card">
      <p>오늘 한 운동과 식단을 기록하여 꾸준한 습관을 만들어보세요!</p>
      <textarea placeholder="예: 스쿼트 5세트, 닭가슴살 샐러드 섭취"></textarea>
      <button class="btn-secondary" onclick="alert('기록이 저장되었습니다!')">저장하기</button>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
